backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "courses"
    label: "Курсы"
    folder: "content/courses"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Название курса", widget: "string" }
      - { name: "category", label: "Категория", widget: "string" }
      - { name: "format", label: "Формат", widget: "string" }
      - { name: "price", label: "Цена", widget: "string" }
      - { name: "date", label: "Дата", widget: "datetime" }

  - name: "reviews"
    label: "Отзывы"
    folder: "content/reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "author", label: "Автор", widget: "string" }
      - { name: "body", label: "Текст отзыва", widget: "markdown" }
      - { name: "date", label: "Дата", widget: "datetime" }

  - name: "gallery"
    label: "Галерея"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Название", widget: "string" }
      - { name: "image", label: "Изображение", widget: "image" }

  - name: "posts"
    label: "Страницы"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Заголовок", widget: "string" }
      - { name: "body", label: "Контент", widget: "markdown" }
  - name: "features"
    label: "Особенности"
    folder: "content/features"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Заголовок", widget: "string" }
      - { name: "text", label: "Описание", widget: "text" }
      - { name: "image", label: "Иконка", widget: "image" }

  - name: "trust"
    label: "Почему нам доверяют"
    folder: "content/trust"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Заголовок", widget: "string" }
      - { name: "text", label: "Описание", widget: "text" }