backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

site_url: https://serene-pothos-ad7e23.netlify.app

collections:
  - name: "courses"
    label: "Курсы"
    folder: "content/courses"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Название курса", widget: "string" }
      - { name: "category", label: "Категория", widget: "string" }
      - { name: "format", label: "Формат", widget: "string" }
      - { name: "price", label: "Цена", widget: "string" }
      - { name: "date", label: "Дата", widget: "datetime" }
